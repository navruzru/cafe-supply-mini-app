<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Заявка кафе</title>
<style>:root{--blue:#2878f0;--bg:#f4f7fb;--ink:#172033;--muted:#748096;--line:#e8edf5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:560px;margin:auto;padding:20px 16px 110px}.top{display:flex;justify-content:space-between;align-items:start;margin-bottom:18px}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.title{font-size:26px;font-weight:800;margin:5px 0}.sub{color:var(--muted)}.badge{background:#e9f2ff;color:var(--blue);border-radius:12px;padding:8px 10px;font-size:12px;font-weight:700}.group{margin:20px 0 8px;color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.item{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);padding:13px 14px;border-radius:14px;margin:8px 0;box-shadow:0 3px 12px #17203306}.name{font-weight:700}.unit{font-size:12px;color:var(--muted);margin-top:2px}.counter{display:flex;align-items:center;gap:12px}.counter button{border:0;width:32px;height:32px;border-radius:10px;background:#edf3fc;color:var(--blue);font-size:22px;line-height:1;cursor:pointer}.count{min-width:22px;text-align:center;font-weight:800}.bottom{position:fixed;bottom:0;left:0;right:0;background:#ffffffee;border-top:1px solid var(--line);padding:13px 16px calc(13px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}.send{display:block;max-width:528px;margin:auto;border:0;border-radius:13px;width:100%;background:var(--blue);color:#fff;padding:14px;font-weight:800;font-size:15px;cursor:pointer}.send:disabled{opacity:.45}.summary{display:none;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:20px}.summary h2{font-size:18px;margin:0 0 12px}.summary-row{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0}.confirm{background:#edf8f2;color:#12805d;padding:10px;border-radius:10px;margin-top:12px;font-weight:700}.hidden{display:none}.back{border:0;background:transparent;color:var(--blue);font-weight:700;cursor:pointer;padding:0;margin-bottom:15px}</style></head>
<body><main class="wrap"><button class="back" onclick="resetForm()">← Изменить кафе</button><div class="top"><div><div class="eyebrow">Ежедневная заявка</div><div class="title" id="cafeTitle">Узбекская кухня</div><div class="sub">Выберите нужное количество товаров</div></div><div class="badge">Сегодня</div></div><div id="catalog"></div><section class="summary" id="summary"><h2>Проверьте заявку</h2><div id="summaryRows"></div><div class="confirm">После подтверждения заявка будет отправлена администратору и водителю.</div></section></main><div class="bottom"><button class="send" id="send" disabled onclick="submitOrder()">✅ Отправить заявку</button></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const products=[['Мука','кг','Бакалея'],['Макароны','кг','Бакалея'],['Сахар','кг','Бакалея'],['Соль','кг','Бакалея'],['Масло растительное','л','Бакалея'],['Рис','кг','Бакалея'],['Гречка','кг','Бакалея'],['Мясо','кг','Мясо и овощи'],['Курица','кг','Мясо и овощи'],['Капуста','кг','Мясо и овощи'],['Лук','кг','Мясо и овощи'],['Морковь','кг','Мясо и овощи'],['Картофель','кг','Мясо и овощи'],['Помидоры','кг','Мясо и овощи'],['Огурцы','кг','Мясо и овощи'],['Зелень','пучок','Мясо и овощи'],['Яйца','шт.','Молочное и соусы'],['Молоко','л','Молочное и соусы'],['Сметана','уп.','Молочное и соусы'],['Майонез','уп.','Молочное и соусы'],['Кетчуп','уп.','Молочное и соусы'],['Вода','бут.','Напитки'],['Сок','л','Напитки'],['Влажные салфетки','уп.','Хозяйственное']];
let cafe=new URLSearchParams(location.search).get('cafe')||'Узбекская кухня';let values=Object.fromEntries(products.map(x=>[x[0],0]));document.getElementById('cafeTitle').textContent=cafe;
function render(){let groups={};products.forEach(p=>(groups[p[2]]??=[]).push(p));document.getElementById('catalog').innerHTML=Object.entries(groups).map(([g,ps])=>`<div class="group">${g}</div>`+ps.map(p=>`<div class="item"><div><div class="name">${p[0]}</div><div class="unit">Единица: ${p[1]}</div></div><div class="counter"><button onclick="change('${p[0]}',-1)">−</button><span class="count" id="n-${p[0]}">0</span><button onclick="change('${p[0]}',1)">+</button></div></div>`).join('')).join('')}
function change(name,delta){values[name]=Math.max(0,values[name]+delta);document.getElementById('n-'+name).textContent=values[name];document.getElementById('send').disabled=!Object.values(values).some(Boolean)}
function submitOrder(){let selected=products.filter(p=>values[p[0]]).map(p=>[p[0],values[p[0]]+' '+p[1]]);document.getElementById('summaryRows').innerHTML=selected.map(x=>`<div class="summary-row"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');document.getElementById('summary').style.display='block';document.getElementById('summary').scrollIntoView({behavior:'smooth'});document.getElementById('send').textContent='✅ Подтвердить заявку';document.getElementById('send').onclick=confirmOrder}
function confirmOrder(){let order={cafe,items:products.filter(p=>values[p[0]]).map(p=>({product:p[0],amount:values[p[0]],unit:p[1]})),user:tg?.initDataUnsafe?.user||null};if(tg?.sendData)tg.sendData(JSON.stringify(order));else{localStorage.setItem('lastCafeOrder',JSON.stringify(order));alert('Заявка сохранена в прототипе');}document.getElementById('send').textContent='✅ Заявка отправлена';document.getElementById('send').disabled=true}
function resetForm(){location.href=location.pathname}render();
</script></body></html>
