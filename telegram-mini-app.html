<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Заявка кафе</title>
<style>:root{--blue:#2878f0;--bg:#f4f7fb;--ink:#172033;--muted:#748096;--line:#e8edf5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:560px;margin:auto;padding:20px 16px 110px}.top{display:flex;justify-content:space-between;align-items:start;margin-bottom:18px}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.title{font-size:26px;font-weight:800;margin:5px 0}.sub{color:var(--muted)}.badge{background:#e9f2ff;color:var(--blue);border-radius:12px;padding:8px 10px;font-size:12px;font-weight:700}.group{margin:20px 0 8px;color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.item{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);padding:13px 14px;border-radius:14px;margin:8px 0;box-shadow:0 3px 12px #17203306}.name{font-weight:700}.unit{font-size:12px;color:var(--muted);margin-top:2px}.counter{display:flex;align-items:center;gap:12px}.counter button{border:0;width:32px;height:32px;border-radius:10px;background:#edf3fc;color:var(--blue);font-size:22px;line-height:1;cursor:pointer}.count{min-width:22px;text-align:center;font-weight:800}.bottom{position:fixed;bottom:0;left:0;right:0;background:#ffffffee;border-top:1px solid var(--line);padding:13px 16px calc(13px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}.send{display:block;max-width:528px;margin:auto;border:0;border-radius:13px;width:100%;background:var(--blue);color:#fff;padding:14px;font-weight:800;font-size:15px;cursor:pointer}.send:disabled{opacity:.45}.summary{display:none;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:20px}.summary h2{font-size:18px;margin:0 0 12px}.summary-row{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0}.confirm{background:#edf8f2;color:#12805d;padding:10px;border-radius:10px;margin-top:12px;font-weight:700}.hidden{display:none}.back{border:0;background:transparent;color:var(--blue);font-weight:700;cursor:pointer;padding:0;margin-bottom:15px}</style></head>
<body>
<main class="wrap">
  <label for="cafeSelect" class="sub">Кафе</label>
  <select id="cafeSelect" onchange="setCafe(this.value)" style="width:100%;padding:12px;margin:6px 0 18px;border:1px solid #e8edf5;border-radius:12px;background:white;font:inherit">
    <option>Узбекская кухня</option><option>Горячая выпечка</option><option>Донер Кебаб</option>
  </select>
  <label for="deliveryDate" class="sub">Дата закупки и доставки</label>
  <input id="deliveryDate" type="date" style="width:100%;padding:12px;margin:6px 0 18px;border:1px solid #e8edf5;border-radius:12px;font:inherit">
  <div class="top"><div><div class="eyebrow">Ежедневная заявка</div><div class="title" id="cafeTitle">Узбекская кухня</div><div class="sub">Укажите количество. Проверка и отправка водителю — в чате с ботом.</div></div><div class="badge">Сегодня</div></div>
  <div id="catalog"></div>
  <p id="status" class="sub" role="status" aria-live="polite"></p>
</main>
<div class="bottom"><button class="send" id="send" disabled onclick="submitOrder()">✓ Готово — проверить в боте</button></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const products=[["Мука","кг","Бакалея",0.5],["Макароны","кг","Бакалея",0.5],["Сахар","кг","Бакалея",0.5],["Соль","кг","Бакалея",0.5],["Масло растительное","л","Бакалея",0.5],["Рис","кг","Бакалея",0.5],["Гречка","кг","Бакалея",0.5],["Яйца","шт.","Другие продукты",1],["Мясо","кг","Другие продукты",0.5],["Курица","кг","Другие продукты",0.5],["Капуста","кг","Другие продукты",0.5],["Лук","кг","Другие продукты",0.5],["Морковь","кг","Другие продукты",0.5],["Картофель","кг","Другие продукты",0.5],["Помидоры","кг","Другие продукты",0.5],["Огурцы","кг","Другие продукты",0.5],["Лимон","кг","Другие продукты",0.5],["Зелень","пучок","Другие продукты",1],["Перец","кг","Другие продукты",0.5],["Молоко","л","Другие продукты",0.5],["Ряженка","л","Другие продукты",0.5],["Творог","кг","Другие продукты",0.5],["Сметана","уп.","Другие продукты",1],["Майонез","уп.","Другие продукты",1],["Кетчуп","уп.","Другие продукты",1],["Горчица","уп.","Другие продукты",1],["Вода","бут.","Напитки",1],["Сок","л","Напитки",0.5],["Pepsi","бут.","Напитки",1],["Чипсы","уп.","Бакалея",1],["Хрен","уп.","Другие продукты",1],["Влажные салфетки","уп.","Посуда и упаковка",1],["Салфетки","уп.","Посуда и упаковка",1],["Стаканы","шт.","Посуда и упаковка",1],["Вилки","шт.","Посуда и упаковка",1],["Ложки","шт.","Посуда и упаковка",1],["Тарелки","шт.","Посуда и упаковка",1],["Контейнеры","шт.","Посуда и упаковка",1],["Пакеты","шт.","Посуда и упаковка",1]];
const params=new URLSearchParams(location.search);
const cafes=['Узбекская кухня','Горячая выпечка','Донер Кебаб'];
const currentDay=new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Moscow'}).format(new Date());
function dayPlus(day,n){const d=new Date(day+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
const hour=Number(new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Moscow',hour:'2-digit',hourCycle:'h23'}).format(new Date()));
const dateInput=document.getElementById('deliveryDate');dateInput.min=currentDay;dateInput.max=dayPlus(currentDay,14);
const initialDate=params.get('delivery_date');
dateInput.value=initialDate&&initialDate>=currentDay&&initialDate<=dateInput.max?initialDate:dayPlus(currentDay,hour>=12?1:0);
document.getElementById('cafeSelect').disabled=params.get('locked')==='1';
let cafe=cafes.includes(params.get('cafe'))?params.get('cafe'):cafes[0];
const values=Object.fromEntries(products.map(p=>[p[0],0]));
const specifications={};
const specifiedProducts=['Вода','Сок','Pepsi','Стаканы','Контейнеры','Тарелки','Пакеты'];
let prefilled={};
try{prefilled=JSON.parse(params.get('items')||'{}')}catch{}
if(Array.isArray(prefilled)){for(const p of prefilled){if(p&&typeof p.spec==='string')specifications[p.product]=p.spec.slice(0,60)}prefilled=Object.fromEntries(prefilled.filter(p=>p&&typeof p==='object').map(p=>[p.product,p.amount]))}
for(const product of products){
  const saved=prefilled?.[product[0]];
  if(typeof saved!=='string')continue;
  const match=saved.match(/^(\d+(?:[.,]\d+)?)\s+(.+)$/);
  if(!match)continue;
  const amount=Number(match[1].replace(',','.'));
  if(Number.isFinite(amount)&&amount>0&&amount<=100000&&['кг','л','шт.','шт','уп.','уп','бут.','пучок'].includes(match[2])){values[product[0]]=amount;product[1]=match[2]}
}
function setCafe(name){cafe=name;document.getElementById('cafeTitle').textContent=cafe;document.getElementById('cafeSelect').value=cafe}
function updateSend(){document.getElementById('send').disabled=!Object.values(values).some(v=>v>0)}
function render(){let groups={};products.forEach(p=>(groups[p[2]]??=[]).push(p));document.getElementById('catalog').innerHTML=Object.entries(groups).map(([g,ps])=>`<div class="group">${g}</div>`+ps.map(p=>`<div class="item"><div style="min-width:0"><div class="name">${p[0]}</div><div class="unit">Единица: ${p[1]}</div>${specifiedProducts.includes(p[0])?`<input id="s-${p[0]}" aria-label="Вид или объём ${p[0]}" placeholder="Вид / объём, например 0,5 л" maxlength="60" style="width:100%;max-width:190px;margin-top:6px;padding:5px;border:1px solid #e8edf5;border-radius:6px" onchange="specifications['${p[0]}']=this.value.trim()">`:''}</div><div class="counter" style="gap:6px"><button aria-label="Уменьшить ${p[0]}" onclick="change('${p[0]}',-1)">−</button><input aria-label="Количество ${p[0]}" type="number" min="0" max="100000" step="${p[3]}" class="count" style="width:68px;border:1px solid #e8edf5;border-radius:6px;padding:6px;font:inherit" id="n-${p[0]}" value="${values[p[0]]}" onchange="setQuantity('${p[0]}',this.value)"><button aria-label="Увеличить ${p[0]}" onclick="change('${p[0]}',1)">+</button></div></div>`).join('')).join('');for(const name of specifiedProducts)document.getElementById('s-'+name).value=specifications[name]||'';updateSend()}
function setQuantity(name,value){const n=Number(String(value).replace(',','.'));const product=products.find(p=>p[0]===name);if(!Number.isFinite(n)||n<0||n>100000||(product[3]===1&&!Number.isInteger(n))){document.getElementById('status').textContent='Укажите допустимое количество. Штучные товары — целым числом.';document.getElementById('n-'+name).value=values[name];return}values[name]=Number(n.toFixed(6));document.getElementById('n-'+name).value=values[name];document.getElementById('status').textContent='';updateSend()}
function change(name,delta){const product=products.find(p=>p[0]===name);const value=Number((values[name]+delta*product[3]).toFixed(6));setQuantity(name,Math.min(100000,Math.max(0,value)))}
function submitOrder(){
  const items=products.filter(p=>values[p[0]]>0).map(p=>({product:p[0],amount:values[p[0]],unit:p[1],...(specifications[p[0]]?{spec:specifications[p[0]]}:{})}));
  if(!items.length)return;
  const status=document.getElementById('status');
  if(!tg?.sendData||tg.platform==='unknown'){status.textContent='Чтобы вернуть заявку в чат, откройте этот список кнопкой внутри бота.';return}
  if(!dateInput.value||dateInput.value<currentDay||dateInput.value>dateInput.max){status.textContent='Выберите дату закупки.';return}
  const order={cafe,items,delivery_date:dateInput.value};
  if(params.has('draft_id')){order.draft_id=Number(params.get('draft_id'));order.revision=Number(params.get('revision'))}
  const payload=JSON.stringify(order);
  if(new TextEncoder().encode(payload).length>4096){status.textContent='Список слишком большой для одной заявки. Разделите его на две заявки.';return}
  document.getElementById('send').disabled=true;
  try{tg.sendData(payload);status.textContent='Вернитесь в чат: бот покажет список и кнопки «Изменить» и «Отправить водителю».'}
  catch{status.textContent='Не удалось вернуть заявку в бот. Попробуйте ещё раз.';updateSend()}
}
setCafe(cafe);render();
</script></body></html>
